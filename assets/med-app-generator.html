<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Med App Screenshot Generator</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #1a1a2e;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .canvas-container {
      text-align: center;
    }
    #canvas {
      border: 2px solid #333;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .btn {
      margin-top: 20px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .instructions {
      color: #a0a0b0;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="canvas-container">
    <canvas id="canvas" width="1200" height="675"></canvas>
    <br>
    <button class="btn" onclick="downloadImage()">Download Image</button>
    <p class="instructions">Right-click and "Save as" or use the button above to download</p>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Create gradient background
    const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    gradient.addColorStop(0, '#0f0c29');
    gradient.addColorStop(0.5, '#302b63');
    gradient.addColorStop(1, '#24243e');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Add subtle grid pattern
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
    ctx.lineWidth = 1;
    for(let i = 0; i < canvas.width; i += 40) {
      ctx.beginPath();
      ctx.moveTo(i, 0);
      ctx.lineTo(i, canvas.height);
      ctx.stroke();
    }
    for(let i = 0; i < canvas.height; i += 40) {
      ctx.beginPath();
      ctx.moveTo(0, i);
      ctx.lineTo(canvas.width, i);
      ctx.stroke();
    }

    // Draw phone mockups
    function drawPhone(x, y, color1, color2) {
      // Phone frame
      ctx.fillStyle = '#2a2a3e';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
      ctx.shadowBlur = 30;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 10;
      roundRect(ctx, x, y, 280, 560, 25);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Screen gradient
      const screenGradient = ctx.createLinearGradient(x, y, x, y + 560);
      screenGradient.addColorStop(0, color1);
      screenGradient.addColorStop(1, color2);
      ctx.fillStyle = screenGradient;
      roundRect(ctx, x + 10, y + 50, 260, 500, 15);
      ctx.fill();

      // Notch
      ctx.fillStyle = '#1a1a2e';
      roundRect(ctx, x + 90, y + 5, 100, 35, 18);
      ctx.fill();

      // Status icons
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.font = 'bold 20px Inter';
      ctx.fillText('9:41', x + 25, y + 30);
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    // Draw three phone mockups
    drawPhone(120, 50, '#667eea', '#764ba2');
    drawPhone(460, 50, '#f093fb', '#f5576c');
    drawPhone(800, 50, '#4facfe', '#00f2fe');

    // Add app icon on first phone
    const iconX = 200;
    const iconY = 150;
    const iconGradient = ctx.createLinearGradient(iconX, iconY, iconX + 80, iconY + 80);
    iconGradient.addColorStop(0, '#667eea');
    iconGradient.addColorStop(1, '#764ba2');
    ctx.fillStyle = iconGradient;
    ctx.shadowColor = 'rgba(102, 126, 234, 0.5)';
    ctx.shadowBlur = 20;
    roundRect(ctx, iconX, iconY, 80, 80, 18);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Add meditation symbol
    ctx.fillStyle = 'white';
    ctx.font = 'bold 48px Arial';
    ctx.fillText('🧘', iconX + 16, iconY + 58);

    // App title
    ctx.fillStyle = 'white';
    ctx.font = 'bold 32px Inter';
    ctx.fillText('Med', iconX + 8, iconY + 110);

    // Add content to second phone - Meditation screen
    const phone2X = 470;
    const phone2Y = 110;
    
    // Meditation circle
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.beginPath();
    ctx.arc(phone2X + 120, phone2Y + 180, 80, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.beginPath();
    ctx.arc(phone2X + 120, phone2Y + 180, 60, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'white';
    ctx.font = '40px Arial';
    ctx.fillText('🧘‍♀️', phone2X + 95, phone2Y + 195);

    // Timer
    ctx.fillStyle = 'white';
    ctx.font = 'bold 36px Inter';
    ctx.textAlign = 'center';
    ctx.fillText('15:00', phone2X + 120, phone2Y + 280);
    
    ctx.font = '18px Inter';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.fillText('Daily Meditation', phone2X + 120, phone2Y + 310);

    // Add content to third phone - Mood tracker
    const phone3X = 810;
    const phone3Y = 110;
    
    // Mood emojis
    const moods = ['😊', '😌', '😐', '😔', '😰'];
    ctx.font = '32px Arial';
    moods.forEach((mood, i) => {
      ctx.fillText(mood, phone3X + 25 + i * 45, phone3Y + 120);
    });

    // Chart bars
    ctx.textAlign = 'left';
    const barColors = ['#4ade80', '#60a5fa', '#a78bfa', '#f472b6', '#fb923c'];
    for(let i = 0; i < 5; i++) {
      const height = 50 + Math.random() * 100;
      ctx.fillStyle = barColors[i];
      ctx.fillRect(phone3X + 20 + i * 45, phone3Y + 350 - height, 35, height);
    }

    ctx.fillStyle = 'white';
    ctx.font = 'bold 18px Inter';
    ctx.textAlign = 'center';
    ctx.fillText('Weekly Report', phone3X + 120, phone3Y + 390);

    // Main title
    ctx.textAlign = 'center';
    ctx.fillStyle = 'white';
    ctx.font = 'bold 64px Inter';
    ctx.shadowColor = 'rgba(102, 126, 234, 0.5)';
    ctx.shadowBlur = 30;
    ctx.fillText('Med App', canvas.width / 2, 620);
    ctx.shadowBlur = 0;

    // Subtitle
    ctx.font = '28px Inter';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.fillText('Meditation & Mood Tracker', canvas.width / 2, 660);

    // Feature badges
    const features = ['React Native', 'Firebase', 'E2E Encrypted', 'Biometric Auth'];
    ctx.font = '16px Inter';
    const badgeY = 705;
    const totalWidth = features.reduce((acc, f) => acc + ctx.measureText(f).width + 40, 0);
    let badgeX = (canvas.width - totalWidth) / 2;

    features.forEach((feature, i) => {
      const width = ctx.measureText(feature).width + 40;
      const badgeGradient = ctx.createLinearGradient(badgeX, badgeY - 15, badgeX + width, badgeY - 15);
      badgeGradient.addColorStop(0, 'rgba(102, 126, 234, 0.3)');
      badgeGradient.addColorStop(1, 'rgba(118, 75, 162, 0.3)');
      
      ctx.fillStyle = badgeGradient;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.lineWidth = 1;
      roundRect(ctx, badgeX, badgeY - 25, width, 35, 18);
      ctx.fill();
      ctx.stroke();
      
      ctx.fillStyle = 'white';
      ctx.fillText(feature, badgeX + 20, badgeY - 5);
      badgeX += width + 15;
    });

    function downloadImage() {
      const link = document.createElement('a');
      link.download = 'med-app.png';
      link.href = canvas.toDataURL();
      link.click();
    }
  </script>
</body>
</html>
